# SpamSharp – in Portainer: Stacks > Add stack > Web editor > diese Datei einfügen,
# unten bei "Environment variables" ADMIN_PASSWORD setzen.
services:
  spamsharp:
    image: ghcr.io/mttkrb/spamsharp:latest
    container_name: spamsharp
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD setzen}
      TZ: Europe/Berlin
      # optional, für „Passwort vergessen“ (ohne SMTP_HOST und PUBLIC_URL ausgeblendet)
      PUBLIC_URL: ${PUBLIC_URL:-}         # Adresse der Weboberfläche für den Link in der Mail, z. B. https://spam.example.de
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}           # leer = SMTP_USER
    volumes:
      - /opt/spamsharp:/data   # Postfächer, Log, gelernte Daten, Regelgewichte
    ports:
      - "8083:8080"
